apiVersion: v1
kind: Namespace
metadata:
  name: student-portal
  labels:
    app.kubernetes.io/name: student-portal
    app.kubernetes.io/instance: production

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-portal-sa
  namespace: student-portal
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/student-portal-app-secrets

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: student-portal-role
  namespace: student-portal
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-portal-rolebinding
  namespace: student-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: student-portal-role
subjects:
  - kind: ServiceAccount
    name: student-portal-sa
    namespace: student-portal

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: student-portal-config
  namespace: student-portal
  labels:
    app: student-portal
    version: "1.0"
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ENABLED: "true"
  API_TIMEOUT: "30000"
  MAX_REQUEST_SIZE: "10mb"
  HEALTH_CHECK_INTERVAL: "30s"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: student-portal-secrets
  namespace: student-portal
  labels:
    app: student-portal
    version: "1.0"
type: Opaque
stringData:
  # These will be injected by CI/CD pipeline
  DB_PASSWORD: ""
  JWT_SECRET: ""
  API_KEY: ""

---
# NetworkPolicy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: student-portal-network-policy
  namespace: student-portal
spec:
  podSelector:
    matchLabels:
      app: student-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 3306
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

---
# PodSecurityPolicy (if cluster has PSP enabled)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: student-portal-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'MustRunAs'
    seLinuxOptions:
      level: 's0:c123,c456'
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  readOnlyRootFilesystem: false

---
# Resource Quota per namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: student-portal-quota
  namespace: student-portal
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "100"
    services: "10"
    persistentvolumeclaims: "5"

---
# Network Policy for pod communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-pod-communication
  namespace: student-portal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
